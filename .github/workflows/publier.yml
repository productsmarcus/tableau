name: Publier le tableau
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
# une nouvelle version annule automatiquement la publication précédente encore en cours
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Annuler les mises en ligne précédentes restées bloquées
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(git log -n 20 --skip 1 --format=%H); do
            if gh api -X POST "repos/${{ github.repository }}/pages/deployments/$sha/cancel" >/dev/null 2>&1; then
              echo "mise en ligne annulée : $sha"
            fi
          done
          sleep 5
      - id: deployment
        uses: actions/deploy-pages@v4
